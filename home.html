<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Entregador - Início</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script>
        window.BASE_PATH = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
        (function(){var t=localStorage.getItem('pedrad-theme')||'dark';document.documentElement.setAttribute('data-theme',t)})();
    </script>
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="toast" id="toast"></div>

    <header class="header">
        <a class="app-brand" href="home.html" aria-label="Pedra Delivery">
            <span class="app-brand-mark"><img src="icon-192.png" alt=""></span>
            <span class="app-brand-text"><span>Pedra</span> Delivery</span>
        </a>
        <div class="header-status">
            <span class="status-text" id="statusText">Offline</span>
            <label class="driver-switch" aria-label="Alternar disponibilidade">
                <input type="checkbox" id="onlineToggle" onchange="toggleOnline()">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <div class="page active" id="homePage">
        <div class="driver-card">
            <div class="driver-avatar" id="driverAvatar" onclick="navigateTo('profile.html')">—</div>
            <div class="driver-info">
                <div class="driver-name" id="driverName">Carregando...</div>
                <div class="driver-vehicle" id="driverVehicle">-</div>
            </div>
            <div class="driver-rating">
                <span>★</span>
                <span id="driverRating">5.0</span>
            </div>
        </div>

        <div id="idleStatusBox" style="display:none;">
            <div class="tracking-indicator" id="idleIndicator">
                <span class="tracking-dot" id="idleDot"></span>
                <span id="idleStatusText">-</span>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value money" id="todayEarnings">R$ 0</div>
                <div class="stat-label">Ganhos hoje</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayDeliveries">0</div>
                <div class="stat-label">Entregas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayDistance">0 km</div>
                <div class="stat-label">Percorrido</div>
            </div>
        </div>

        <div id="currentDeliverySection" style="display:none;">
            <div class="section-title" id="currentDeliveryTitle">Entrega em Andamento</div>
            <div id="currentDelivery"></div>
        </div>

        <div id="acceptedSection" style="display:none;">
            <div class="section-title">
                Minhas Entregas
                <span class="section-badge" id="acceptedCount">0</span>
            </div>
            <div id="acceptedOrders"></div>
        </div>

        <div id="availableSection">
            <div class="section-title">
                Disponíveis
                <span class="section-badge" id="availableCount">0</span>
            </div>
            <div id="availableDeliveries"></div>
        </div>
    </div>

    <div class="modal" id="acceptModal">
        <div class="modal-content">
            <div class="modal-icon">◎</div>
            <div class="modal-title">Aceitar Entrega?</div>
            <div class="modal-text" id="acceptModalText">-</div>
            <div class="modal-info" id="acceptModalInfo"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('acceptModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="confirmAccept()">Aceitar</button>
            </div>
        </div>
    </div>

    <div class="modal" id="deliverModal">
        <div class="modal-content">
            <div class="modal-icon">✓</div>
            <div class="modal-title">Finalizar Entrega</div>
            <div class="modal-text" id="deliverModalText">Confirme que o pedido foi entregue ao cliente.</div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('deliverModal')">Cancelar</button>
                <button class="btn btn-success" onclick="confirmDelivery()" id="confirmDeliveryBtn">Confirmar Entrega</button>
            </div>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-title" id="confirmModalTitle">Confirmar</div>
            <div class="modal-text" id="confirmModalText">Deseja continuar?</div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('confirmModal')">Cancelar</button>
                <button class="btn btn-primary" id="confirmModalBtn">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="nav-map-popup" id="navMapPopup">
        <div class="map-header">
            <span class="map-title">Destino</span>
            <button class="map-close" onclick="closeNavMap()">×</button>
        </div>
        <div id="navMap"></div>
    </div>
    <button class="nav-map-btn" id="navMapBtn" onclick="openNavMap()">🗺️</button>

    <nav class="nav" id="bottomNav"></nav>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>window.PEDRAD_DRIVER_APP_VERSION = '1.0.0';</script>
    <script src="./modules/cache.js"></script>
    <script src="./modules/firebase-init.js"></script>
    <script src="./modules/shared.js"></script>
    <script src="./modules/idle.js"></script>
    <script src="./modules/fcm.js"></script>
    <script src="./modules/update-guard.js"></script>
    <script src="./home-core.js"></script>
    <script src="./home-ui.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const ok = await checkAuth();
        if (!ok) return;
        const updateOk = await AppUpdateGuard.checkAndBlockIfNeeded();
        if (!updateOk) return;

        renderBottomNav('home.html');

        isOnline = Cache.getOnline();
        if (isOnline) {
            document.getElementById('onlineToggle').checked = true;
            document.getElementById('statusText').textContent = 'Online';
        }

        await loadSharedData();

        const freshDoc = await db.collection('drivers').doc(driverData.id).get();
        if (freshDoc.exists) Object.assign(driverData, freshDoc.data());

        updateDriverCard();
        if (window.Android) Android.setDriverId(driverData.id);

        setupListeners();
        setupDriverPushNotifications({ requestPermission: false });

        if (IdleDriver.isStoreDriver()) {
            await IdleDriver.init();
            IdleDriver.onStateChange = updateIdleUI;
            updateIdleUI();
            document.getElementById('idleStatusBox').style.display = 'block';
        }
    });
    </script>
</body>
</html>
