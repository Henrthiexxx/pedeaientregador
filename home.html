<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pedrad - Início</title>
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="toast" id="toast"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-title">PEDRAD</div>
        <div class="header-status">
            <span class="status-text" id="statusText">Offline</span>
            <div class="toggle" id="onlineToggle" onclick="toggleOnline()"></div>
        </div>
    </header>

    <div class="page active" id="homePage">
        <!-- Driver Card -->
        <div class="driver-card">
            <div class="driver-avatar" id="driverAvatar" onclick="navigateTo('profile.html')">—</div>
            <div class="driver-info">
                <div class="driver-name" id="driverName">Carregando...</div>
                <div class="driver-vehicle" id="driverVehicle">-</div>
            </div>
            <div class="driver-rating">
                <span>★</span>
                <span id="driverRating">5.0</span>
            </div>
        </div>

        <!-- Idle Driver Status (only for store drivers) -->
        <div id="idleStatusBox" style="display:none;">
            <div class="tracking-indicator" id="idleIndicator">
                <span class="tracking-dot" id="idleDot"></span>
                <span id="idleStatusText">-</span>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value money" id="todayEarnings">R$ 0</div>
                <div class="stat-label">Ganhos hoje</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayDeliveries">0</div>
                <div class="stat-label">Entregas</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayDistance">0 km</div>
                <div class="stat-label">Percorrido</div>
            </div>
        </div>

        <!-- Current Delivery (in transit) -->
        <div id="currentDeliverySection" style="display:none;">
            <div class="section-title">Entrega em Andamento</div>
            <div class="current-delivery" id="currentDelivery"></div>
        </div>

        <!-- Accepted Orders (ALWAYS VISIBLE after accept) -->
        <div id="acceptedSection" style="display:none;">
            <div class="section-title">
                Minhas Entregas
                <span class="section-badge" id="acceptedCount">0</span>
            </div>
            <div id="acceptedOrders"></div>
        </div>

        <!-- Available Deliveries -->
        <div id="availableSection">
            <div class="section-title">
                Disponíveis
                <span class="section-badge" id="availableCount">0</span>
            </div>
            <div id="availableDeliveries"></div>
        </div>
    </div>

    <!-- Accept Modal -->
    <div class="modal" id="acceptModal">
        <div class="modal-content">
            <div class="modal-icon">◎</div>
            <div class="modal-title">Aceitar Entrega?</div>
            <div class="modal-text" id="acceptModalText">-</div>
            <div class="modal-info" id="acceptModalInfo"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('acceptModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="confirmAccept()">Aceitar</button>
            </div>
        </div>
    </div>

    <!-- Deliver Modal -->
    <div class="modal" id="deliverModal">
        <div class="modal-content">
            <div class="modal-icon">✓</div>
            <div class="modal-title">Finalizar Entrega</div>
            <div class="modal-text">Confirme a entrega e envie sua localização</div>
            <div class="location-box" id="locationBox">
                <div class="location-status" id="locationStatus">
                    <span class="location-icon">◉</span>
                    <span class="location-text">Capturando localização...</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('deliverModal')">Cancelar</button>
                <button class="btn btn-success" onclick="confirmDelivery()" id="confirmDeliveryBtn" disabled>Aguarde GPS...</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-title" id="confirmModalTitle">Confirmar</div>
            <div class="modal-text" id="confirmModalText">Deseja continuar?</div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('confirmModal')">Cancelar</button>
                <button class="btn btn-primary" id="confirmModalBtn">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Nav Map -->
    <div class="nav-map-popup" id="navMapPopup">
        <div class="map-header">
            <span class="map-title">Destino</span>
            <button class="map-close" onclick="closeNavMap()">×</button>
        </div>
        <div id="navMap"></div>
    </div>
    <button class="nav-map-btn" id="navMapBtn" onclick="openNavMap()">🗺️</button>

    <!-- Bottom Nav -->
    <nav class="nav" id="bottomNav"></nav>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="modules/cache.js"></script>
    <script src="modules/firebase-init.js"></script>
    <script src="modules/shared.js"></script>
    <script src="modules/idle.js"></script>
    <script src="modules/fcm.js"></script>
    <script>
    // ==================== STATE ====================
    let isOnline = false;
    let currentDelivery = null;
    let acceptedOrders = [];
    let availableOrders = [];
    let allHistory = [];
    let pendingAcceptOrder = null;
    let capturedLocation = null;
    let onlineInterval = null;
    let locationWatchId = null;
    let lastLocationUpdate = 0;
    let navMap = null;

    // ==================== INIT ====================
    document.addEventListener('DOMContentLoaded', async () => {
        const ok = await checkAuth();
        if (!ok) return;

        renderBottomNav('home.html');
        updateDriverCard();

        isOnline = Cache.getOnline();
        if (isOnline) {
            document.getElementById('onlineToggle').classList.add('active');
            document.getElementById('statusText').textContent = 'Online';
        }

        await loadSharedData();
        await loadOrders();

        setupListeners();
        setupDriverPushNotifications();

        // Idle driver system
        if (IdleDriver.isStoreDriver()) {
            await IdleDriver.init();
            IdleDriver.onStateChange = updateIdleUI;
            updateIdleUI();
            document.getElementById('idleStatusBox').style.display = 'block';
        }
    });

    // ==================== DRIVER UI ====================
    function updateDriverCard() {
        if (!driverData) return;
        const vehicleNames = { moto: 'Moto', bicicleta: 'Bicicleta', carro: 'Carro' };
        const v = vehicleNames[driverData.vehicle] || 'Moto';

        document.getElementById('driverName').textContent = driverData.name || 'Entregador';
        document.getElementById('driverVehicle').textContent = `${v} ${driverData.plate ? '• ' + driverData.plate : ''}`;
        document.getElementById('driverRating').textContent = (driverData.rating || 5.0).toFixed(1);

        const avatar = document.getElementById('driverAvatar');
        if (driverData.photoUrl) {
            avatar.style.backgroundImage = `url(${driverData.photoUrl})`;
            avatar.style.backgroundSize = 'cover';
            avatar.style.backgroundPosition = 'center';
            avatar.textContent = '';
        } else {
            avatar.style.backgroundImage = 'none';
            avatar.textContent = driverData.name ? driverData.name.charAt(0).toUpperCase() : '—';
        }
    }

    function updateIdleUI() {
        const text = document.getElementById('idleStatusText');
        const dot = document.getElementById('idleDot');
        if (!text || !dot) return;

        text.textContent = IdleDriver.getStateLabel();
        dot.style.background = IdleDriver.getStateColor();

        if (IdleDriver.state === 'COOLDOWN') {
            dot.style.animation = 'none';
        } else if (IdleDriver.state === 'STORE_IDLE') {
            dot.style.animation = 'trackingPulse 1.5s infinite';
        }
    }

    // ==================== ORDERS LOADING ====================
    async function loadOrders() {
        await Promise.all([
            loadAvailableOrders(),
            loadMyOrders()
        ]);
        updateStats();
    }

    async function loadAvailableOrders() {
        try {
            const snapshot = await db.collection('orders')
                .where('status', 'in', ['preparing', 'ready'])
                .get();
            availableOrders = snapshot.docs
                .map(doc => ({ id: doc.id, ...doc.data() }))
                .filter(o => !o.driverId && o.deliveryMode !== 'pickup');
            renderAvailableOrders();
        } catch (e) { console.error('Error loading orders:', e); }
    }

    async function loadMyOrders() {
        if (!driverData) return;
        try {
            // Single query for all my active orders
            const snapshot = await db.collection('orders')
                .where('driverId', '==', driverData.id)
                .where('status', 'in', ['preparing', 'ready', 'delivering'])
                .get();

            const myOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            // Accepted = preparing + ready (driver can see from acceptance onwards)
            acceptedOrders = myOrders.filter(o => o.status === 'preparing' || o.status === 'ready');
            renderAcceptedOrders();

            // Current = delivering
            const delivering = myOrders.find(o => o.status === 'delivering');
            if (delivering) {
                currentDelivery = delivering;
                renderCurrentDelivery();
                startLocationTracking();
            } else {
                currentDelivery = null;
                document.getElementById('currentDeliverySection').style.display = 'none';
                stopLocationTracking();
            }
            showNavMapButton();
        } catch (e) { console.error('Error loading my orders:', e); }
    }

    // Load history for stats (use cache)
    async function loadHistoryForStats() {
        const cached = Cache.getHistory();
        if (cached) {
            allHistory = cached;
            return;
        }
        try {
            const snapshot = await db.collection('orders')
                .where('driverId', '==', driverData.id)
                .where('status', '==', 'delivered')
                .get();
            allHistory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            Cache.setHistory(allHistory);
        } catch (e) { console.error('Error loading history:', e); }
    }

    // ==================== REALTIME LISTENERS ====================
    function setupListeners() {
        // Available orders
        db.collection('orders')
            .where('status', 'in', ['preparing', 'ready'])
            .onSnapshot(snapshot => {
                const prev = availableOrders.length;
                availableOrders = snapshot.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .filter(o => !o.driverId && o.deliveryMode !== 'pickup');
                renderAvailableOrders();

                if (availableOrders.length > prev && isOnline && !currentDelivery) {
                    playNotificationSound();
                    showToast('Nova entrega disponível');
                }
            });

        // My orders (accepted + delivering)
        if (driverData) {
            db.collection('orders')
                .where('driverId', '==', driverData.id)
                .where('status', 'in', ['preparing', 'ready', 'delivering'])
                .onSnapshot(snapshot => {
                    const myOrders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                    acceptedOrders = myOrders.filter(o => o.status === 'preparing' || o.status === 'ready');
                    renderAcceptedOrders();

                    const delivering = myOrders.find(o => o.status === 'delivering');
                    if (delivering) {
                        const wasDelivering = !!currentDelivery;
                        currentDelivery = delivering;
                        renderCurrentDelivery();
                        if (!wasDelivering) startLocationTracking();
                    } else {
                        if (currentDelivery) stopLocationTracking();
                        currentDelivery = null;
                        document.getElementById('currentDeliverySection').style.display = 'none';
                    }

                    showNavMapButton();
                    updateStats();
                });

            // Driver data changes
            setupDriverListener((newData, oldData) => {
                updateDriverCard();
                if (IdleDriver.isStoreDriver()) updateIdleUI();

                if (oldData?.rating && newData.rating && newData.rating !== oldData.rating) {
                    const diff = (newData.rating - oldData.rating).toFixed(1);
                    showToast(`${diff > 0 ? '↑' : '↓'} Avaliação: ${newData.rating.toFixed(1)}`);
                }
            });

            // Fees
            setupFeesListener();
        }

        // Delivered orders for stats - check periodically via cache invalidation
        loadHistoryForStats();
    }

    // ==================== RENDER ====================
function renderAvailableOrders() {
    const container = document.getElementById('availableDeliveries');

    // Store driver: só vê pedidos da própria loja
    let filtered = availableOrders;
    if (driverData?.driverType === 'store' && driverData?.storeId) {
        filtered = availableOrders.filter(o => o.storeId === driverData.storeId);
    }

    document.getElementById('availableCount').textContent = filtered.length;

    if (!isOnline) {
        container.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon">○</div>
            <div class="empty-state-title">Você está offline</div>
            <div class="empty-state-text">Ative o botão acima para receber entregas</div>
        </div>`;
        return;
    }

    const maxOrders = driverData?.maxSimultaneousOrders || 1;
    const myActive = (acceptedOrders.length || 0) + (currentDelivery ? 1 : 0);

    if (myActive >= maxOrders) {
        container.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon">◎</div>
            <div class="empty-state-title">Limite atingido</div>
            <div class="empty-state-text">Finalize suas entregas antes de aceitar novas</div>
        </div>`;
        return;
    }

    if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon">—</div>
            <div class="empty-state-title">Nenhuma entrega disponível</div>
            <div class="empty-state-text">Aguarde novos pedidos</div>
        </div>`;
        return;
    }

    container.innerHTML = filtered.map(order => {
        const waitTime = getWaitTime(order.createdAt);
        const fee = getDeliveryFee(order.address?.neighborhood);
        const earning = calculateDriverEarning(fee, order.distance);

        return `
        <div class="delivery-card ${waitTime > 15 ? 'urgent' : ''}" id="order-${order.id}">
            <div class="delivery-header">
                <div class="delivery-store">
                    <div class="delivery-store-icon" id="icon-${order.id}">□</div>
                    <div>
                        <div class="delivery-store-name">${order.storeName || 'Loja'}</div>
                        <div class="delivery-store-time">Aguardando há ${waitTime} min</div>
                    </div>
                </div>
                <div class="delivery-value">
                    <div class="delivery-fee">+ ${formatCurrency(earning)}</div>
                    <div class="delivery-distance">${order.distance ? order.distance.toFixed(1) + ' km' : order.address?.neighborhood || ''}</div>
                </div>
            </div>
            <div class="delivery-body">
                <div class="delivery-address">
                    <div class="address-icon">□</div>
                    <div class="address-info">
                        <div class="address-label">Retirar em</div>
                        <div class="address-text">${order.storeName || 'Loja'}</div>
                    </div>
                </div>
                <div class="delivery-address">
                    <div class="address-icon">◎</div>
                    <div class="address-info">
                        <div class="address-label">Entregar em</div>
                        <div class="address-text">${order.address?.street || ''}, ${order.address?.number || ''} - ${order.address?.neighborhood || ''}</div>
                    </div>
                </div>
                <div class="delivery-actions">
                    <button class="btn btn-primary" onclick="acceptOrder('${order.id}')">Aceitar Entrega</button>
                </div>
            </div>
        </div>`;
    }).join('');

    filtered.forEach(async order => {
        if (order.storeId) {
            const store = await getStoreData(order.storeId);
            if (store?.logoUrl) {
                const el = document.getElementById('icon-' + order.id);
                if (el) {
                    el.style.backgroundImage = `url(${store.logoUrl})`;
                    el.style.backgroundSize = 'cover';
                    el.style.backgroundPosition = 'center';
                    el.textContent = '';
                }
            }
        }
    });
}

    function renderAcceptedOrders() {
        const section = document.getElementById('acceptedSection');
        const container = document.getElementById('acceptedOrders');

        if (acceptedOrders.length === 0) {
            section.style.display = 'none';
            return;
        }

        section.style.display = 'block';
        document.getElementById('acceptedCount').textContent = acceptedOrders.length;

        container.innerHTML = acceptedOrders.map(order => {
            const fee = getDeliveryFee(order.address?.neighborhood);
            const earning = calculateDriverEarning(order.driverEarning || fee, order.distance);
            const statusLabel = order.status === 'preparing' ? 'Preparando' : 'Pronto p/ retirada';
            const canPickup = order.status === 'ready';

            return `
            <div class="delivery-card" id="accepted-${order.id}" style="border-color: var(--text-muted);">
                <div class="delivery-header">
                    <div class="delivery-store">
                        <div class="delivery-store-icon" id="aicon-${order.id}">□</div>
                        <div>
                            <div class="delivery-store-name">${order.storeName || 'Loja'}</div>
                            <div class="delivery-store-time">${statusLabel}</div>
                        </div>
                    </div>
                    <div class="delivery-value">
                        <div class="delivery-fee">+ ${formatCurrency(earning)}</div>
                        <div class="delivery-distance">${order.distance ? order.distance.toFixed(1) + ' km' : order.address?.neighborhood || ''}</div>
                    </div>
                </div>
                <div class="delivery-body">
                    <div class="delivery-address">
                        <div class="address-icon">□</div>
                        <div class="address-info">
                            <div class="address-label">Retirar em</div>
                            <div class="address-text">${order.storeName || 'Loja'}</div>
                        </div>
                    </div>
                    <div class="delivery-address">
                        <div class="address-icon">◎</div>
                        <div class="address-info">
                            <div class="address-label">Entregar em</div>
                            <div class="address-text">${order.address?.street || ''}, ${order.address?.number || ''} - ${order.address?.neighborhood || ''}</div>
                        </div>
                    </div>
                    <div class="delivery-actions">
                        ${canPickup 
                            ? `<button class="btn btn-warning" onclick="startDelivery('${order.id}')" style="flex:1;">Iniciar Retirada</button>`
                            : `<button class="btn btn-secondary" disabled style="flex:1;">Aguardando preparo</button>`
                        }
                    </div>
                </div>
            </div>`;
        }).join('');

        // Load store logos async
        acceptedOrders.forEach(async order => {
            if (order.storeId) {
                const store = await getStoreData(order.storeId);
                if (store?.logoUrl) {
                    const el = document.getElementById('aicon-' + order.id);
                    if (el) {
                        el.style.backgroundImage = `url(${store.logoUrl})`;
                        el.style.backgroundSize = 'cover';
                        el.style.backgroundPosition = 'center';
                        el.textContent = '';
                    }
                }
            }
        });
    }

    function renderCurrentDelivery() {
        if (!currentDelivery) return;
        document.getElementById('currentDeliverySection').style.display = 'block';

        const fee = getDeliveryFee(currentDelivery.address?.neighborhood);
        const earning = calculateDriverEarning(currentDelivery.driverEarning || fee, currentDelivery.distance);
        const clientName = currentDelivery.userName || 'Cliente';
        const clientPhone = currentDelivery.userPhone || '';

        document.getElementById('currentDelivery').innerHTML = `
            <div class="current-delivery-header">
                <div class="current-delivery-title">Pedido #${currentDelivery.id.slice(-6).toUpperCase()}</div>
                <span class="current-delivery-status status-delivering">Entregar</span>
            </div>
            <div class="tracking-indicator">
                <span class="tracking-dot"></span>
                <span>Compartilhando localização com cliente</span>
            </div>
            <div class="route-line">
                <div class="route-dots">
                    <div class="route-dot"></div>
                    <div class="route-line-connector"></div>
                    <div class="route-dot end"></div>
                </div>
                <div class="route-addresses">
                    <div class="route-address">
                        <div class="route-address-label">Retirar</div>
                        <div class="route-address-text">${currentDelivery.storeName || 'Loja'}</div>
                    </div>
                    <div class="route-address">
                        <div class="route-address-label">Entregar</div>
                        <div class="route-address-text">${currentDelivery.address?.street || ''}, ${currentDelivery.address?.number || ''}</div>
                    </div>
                </div>
            </div>
            <div class="client-box">
                <div class="client-label">Cliente</div>
                <div class="client-name">${clientName}</div>
                ${clientPhone ? `<div class="client-phone"><a href="tel:${clientPhone}" style="color:var(--primary);text-decoration:none;">${clientPhone}</a></div>` : ''}
                ${currentDelivery.address?.complement ? `<div style="font-size:0.8rem;color:var(--text-muted);margin-top:8px;">${currentDelivery.address.complement}</div>` : ''}
                ${currentDelivery.address?.reference ? `<div style="font-size:0.8rem;color:var(--text-muted);">Ref: ${currentDelivery.address.reference}</div>` : ''}
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:12px;background:var(--bg-input);border-radius:8px;border:1px solid var(--border);">
                <span style="color:var(--text-muted);font-size:0.85rem;">Seu ganho</span>
                <span style="font-weight:500;color:var(--primary);">${formatCurrency(earning)}</span>
            </div>
            <div class="delivery-actions">
                <button class="btn btn-success btn-block" onclick="openDeliverModal()">Finalizar Entrega</button>
            </div>`;
    }

    function updateStats() {
        loadHistoryForStats().then(() => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const todayOrders = allHistory.filter(o => {
                const date = o.deliveredAt?.toDate?.() || new Date(o.deliveredAt);
                return date >= today;
            });

            let money = 0, dist = 0;
            todayOrders.forEach(o => {
                const fee = o.driverEarning || getDeliveryFee(o.address?.neighborhood);
                money += calculateDriverEarning(fee, o.distance);
                dist += o.distance || 3.5;
            });

            document.getElementById('todayEarnings').textContent = formatCurrency(money);
            document.getElementById('todayDeliveries').textContent = todayOrders.length;
            document.getElementById('todayDistance').textContent = `${dist.toFixed(1)} km`;
        });
    }

    // ==================== ACTIONS ====================
    function toggleOnline() {
        isOnline = !isOnline;
        document.getElementById('onlineToggle').classList.toggle('active', isOnline);
        document.getElementById('statusText').textContent = isOnline ? 'Online' : 'Offline';
        Cache.setOnline(isOnline);
        updateDriverOnlineStatus(isOnline);

        if (isOnline) {
            startOnlineHeartbeat();
            // Idle driver: go online
            if (IdleDriver.isStoreDriver()) IdleDriver.transition('GO_ONLINE');
        } else {
            stopOnlineHeartbeat();
            if (IdleDriver.isStoreDriver()) IdleDriver.transition('GO_OFFLINE');
        }

        renderAvailableOrders();
        showToast(isOnline ? 'Você está online' : 'Você está offline');
    }

    function startOnlineHeartbeat() {
        if (onlineInterval) clearInterval(onlineInterval);
        onlineInterval = setInterval(() => {
            if (isOnline && driverData) updateDriverOnlineStatus(true);
        }, 60000);
    }

    function stopOnlineHeartbeat() {
        if (onlineInterval) { clearInterval(onlineInterval); onlineInterval = null; }
    }

    async function updateDriverOnlineStatus(online) {
        if (!driverData) return;
        try {
            await db.collection('drivers').doc(driverData.id).update({
                online,
                lastOnlineAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (e) { console.error('Error updating status:', e); }
    }

    // ==================== ACCEPT ORDER ====================
    function acceptOrder(orderId) {
        pendingAcceptOrder = availableOrders.find(o => o.id === orderId);
        if (!pendingAcceptOrder) return;

        const fee = getDeliveryFee(pendingAcceptOrder.address?.neighborhood);
        const earning = calculateDriverEarning(fee, pendingAcceptOrder.distance);

        document.getElementById('acceptModalText').textContent =
            `${pendingAcceptOrder.storeName} → ${pendingAcceptOrder.address?.neighborhood}`;

        document.getElementById('acceptModalInfo').innerHTML = `
            <div style="display:flex;justify-content:space-between;">
                <span>Taxa de entrega</span><span>${formatCurrency(fee)}</span>
            </div>
            ${pendingAcceptOrder.distance ? `<div style="display:flex;justify-content:space-between;margin-top:8px;">
                <span>Distância</span><span>${pendingAcceptOrder.distance.toFixed(1)} km</span>
            </div>` : ''}
            <div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:500;color:var(--primary);">
                <span>Seu ganho</span><span>${formatCurrency(earning)}</span>
            </div>`;

        openModal('acceptModal');
    }

    async function confirmAccept() {
            if (!pendingAcceptOrder || !driverData) return;

    // Store driver: bloqueia pedidos de outras lojas
    if (driverData.driverType === 'store' && driverData.storeId && pendingAcceptOrder.storeId !== driverData.storeId) {
        closeModal('acceptModal');
        showToast('Você só pode aceitar entregas da sua loja');
        return;
    }

    const maxOrders = driverData.maxSimultaneousOrders || 1;
        if (!pendingAcceptOrder || !driverData) return;

       
        const myActive = acceptedOrders.length + (currentDelivery ? 1 : 0);
        if (myActive >= maxOrders) {
            closeModal('acceptModal');
            showToast('Limite de entregas simultâneas atingido');
            return;
        }

        try {
            const fee = getDeliveryFee(pendingAcceptOrder.address?.neighborhood);
            const earning = calculateDriverEarning(fee, pendingAcceptOrder.distance);

            const timeline = pendingAcceptOrder.timeline || [];
            timeline.push({
                status: 'accepted',
                timestamp: new Date().toISOString(),
                message: `Entregador ${driverData.name} aceitou`
            });

            await db.collection('orders').doc(pendingAcceptOrder.id).update({
                driverId: driverData.id,
                driverName: driverData.name,
                driverPhone: driverData.phone,
                driverVehicle: driverData.vehicle,
                driverEarning: earning,
                timeline,
                acceptedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Idle driver: mark as on app trip
            if (IdleDriver.isStoreDriver()) {
                IdleDriver.transition('APP_TRIP_ASSIGNED');
            }

            closeModal('acceptModal');
            showToast('Entrega aceita');
            pendingAcceptOrder = null;
        } catch (e) {
            console.error('Error accepting:', e);
            showToast('Erro ao aceitar entrega');
        }
    }

    // ==================== START DELIVERY ====================
    function startDelivery(orderId) {
        const order = acceptedOrders.find(o => o.id === orderId);
        if (!order) return;
        showConfirmModal('Retirar pedido?', 'Confirme que você está retirando o pedido na loja.', () => executeStartDelivery(order), 'Confirmar retirada');
    }

    async function executeStartDelivery(order) {
        try {
            const timeline = order.timeline || [];
            timeline.push({
                status: 'delivering',
                timestamp: new Date().toISOString(),
                message: 'Pedido retirado, saiu para entrega'
            });

            await db.collection('orders').doc(order.id).update({
                status: 'delivering',
                timeline,
                pickedUpAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            showToast('Pedido retirado - Siga para o cliente');
        } catch (e) {
            console.error('Error starting delivery:', e);
            showToast('Erro ao iniciar entrega');
        }
    }

    // ==================== CONFIRM DELIVERY ====================
    function openDeliverModal() {
        capturedLocation = null;
        openModal('deliverModal');
        setTimeout(captureLocationAuto, 500);
    }

    function captureLocationAuto() {
        const statusEl = document.getElementById('locationStatus');
        const btnEl = document.getElementById('confirmDeliveryBtn');

        statusEl.innerHTML = '<span class="location-icon">◌</span><span class="location-text">Capturando localização...</span>';
        statusEl.className = 'location-status loading';
        btnEl.disabled = true;
        btnEl.textContent = 'Aguarde GPS...';

        if (!navigator.geolocation) {
            statusEl.innerHTML = '<span class="location-icon">×</span><span class="location-text">GPS não disponível</span>';
            statusEl.className = 'location-status error';
            btnEl.disabled = false;
            btnEl.textContent = 'Confirmar mesmo assim';
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                capturedLocation = {
                    lat: pos.coords.latitude, lng: pos.coords.longitude,
                    accuracy: pos.coords.accuracy, timestamp: new Date().toISOString()
                };
                statusEl.innerHTML = `<span class="location-icon">✓</span><span class="location-text">Localização capturada<br><small>Precisão: ${pos.coords.accuracy.toFixed(0)}m</small></span>`;
                statusEl.className = 'location-status success';
                btnEl.disabled = false;
                btnEl.textContent = 'Confirmar Entrega';
            },
            (err) => {
                let msg = 'Erro ao capturar';
                if (err.code === 1) msg = 'Permissão negada';
                if (err.code === 2) msg = 'GPS indisponível';
                if (err.code === 3) msg = 'Tempo esgotado';
                statusEl.innerHTML = `<span class="location-icon">!</span><span class="location-text">${msg}</span>`;
                statusEl.className = 'location-status error';
                btnEl.disabled = false;
                btnEl.textContent = 'Confirmar mesmo assim';
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

async function confirmDelivery() {
    if (!currentDelivery) return;
    const deliveryRef = currentDelivery; // salva referência local
    stopLocationTracking();

    try {
        const timeline = deliveryRef.timeline || [];
        timeline.push({
            status: 'delivered',
            timestamp: new Date().toISOString(),
            message: 'Pedido entregue ao cliente',
            location: capturedLocation
        });

        const updateData = {
            status: 'delivered',
            timeline,
            deliveredAt: new Date().toISOString(),
            driverLocation: null
        };
        if (capturedLocation) updateData.deliveryLocation = capturedLocation;

        await db.collection('orders').doc(deliveryRef.id).update(updateData);

        if (driverData) {
            await db.collection('drivers').doc(driverData.id).update({
                totalDeliveries: firebase.firestore.FieldValue.increment(1),
                lastDeliveryAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        if (IdleDriver.isStoreDriver()) {
            IdleDriver.transition('APP_TRIP_ENDED');
        }

        Cache.remove('history');

        const earning = deliveryRef.driverEarning || platformConfig.driverFee;
        closeModal('deliverModal');
        hideNavMapButton();
        showToast(`Entrega concluída +${formatCurrency(earning)}`);
        capturedLocation = null;
    } catch (e) {
        console.error('Error confirming delivery:', e);
        showToast('Erro: ' + (e.message || 'Tente novamente'));
    }
}

    function stopLocationTracking() {
        if (locationWatchId !== null) {
            navigator.geolocation.clearWatch(locationWatchId);
            locationWatchId = null;
        }
    }

    async function updateDriverLocationInOrder(location) {
        if (!currentDelivery || !driverData) return;
        try {
            await db.collection('orders').doc(currentDelivery.id).update({
                driverLocation: location,
                driver: {
                    id: driverData.id, name: driverData.name,
                    phone: driverData.phone || '', vehicle: driverData.vehicle || 'Moto',
                    photoUrl: driverData.photoUrl || null
                }
            });
        } catch (e) { console.error('Error updating location:', e); }
    }

    // ==================== NAV MAP ====================
    function openNavMap() {
        if (!currentDelivery?.address?.location) {
            showToast('Cliente não tem localização salva');
            return;
        }
        document.getElementById('navMapPopup').classList.add('active');
        document.getElementById('navMapBtn').classList.remove('active');

        setTimeout(() => {
            const loc = currentDelivery.address.location;
            if (navMap) navMap.remove();
            navMap = L.map('navMap').setView([loc.lat, loc.lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(navMap);
            L.marker([loc.lat, loc.lng]).addTo(navMap)
                .bindPopup(`${currentDelivery.address.street}, ${currentDelivery.address.number}`).openPopup();
        }, 100);
    }

    function closeNavMap() {
        document.getElementById('navMapPopup').classList.remove('active');
        if (currentDelivery) document.getElementById('navMapBtn').classList.add('active');
    }

    function showNavMapButton() {
        if (currentDelivery?.address?.location) {
            document.getElementById('navMapBtn').classList.add('active');
        }
    }

    function hideNavMapButton() {
        document.getElementById('navMapBtn').classList.remove('active');
        document.getElementById('navMapPopup').classList.remove('active');
    }
    </script>
</body>
