<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pedrad - Entregador</title>
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="auth-container">
        <div class="auth-logo">
            <h1>PEDRAD</h1>
            <p>Entregador</p>
        </div>
        <div class="auth-box">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
            </form>
            <p class="auth-hint">Credenciais fornecidas pelo administrador</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="modules/cache.js"></script>
    <script src="modules/firebase-init.js"></script>
    <script>
        // If already logged in, go to home
        const savedId = localStorage.getItem('pedrad_driver_id');
        if (savedId) {
            window.location.href = 'home.html';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            try {
                const snapshot = await db.collection('drivers')
                    .where('email', '==', email)
                    .limit(1)
                    .get();

                if (snapshot.empty) {
                    showToast('Entregador não cadastrado');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }

                const driver = { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };

                if (driver.status === 'blocked') {
                    showToast('Sua conta está bloqueada');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }

                if (driver.password !== password) {
                    showToast('Senha incorreta');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }

                // Save session
                Cache.setDriverId(driver.id);
                Cache.setDriver(driver);
                Cache.setOnline(false);

                window.location.href = 'home.html';

            } catch (err) {
                console.error('Login error:', err);
                showToast('Erro ao entrar');
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
