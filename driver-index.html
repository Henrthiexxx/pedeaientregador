<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Entregador</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="auth-container">
        <div class="auth-logo">
            <h1>Pedra Delivery</h1>
            <p>Entregador</p>
        </div>
        <div class="auth-box">
            <div class="auth-tabs" style="display:flex;gap:8px;margin-bottom:16px;">
                <button type="button" class="btn btn-primary btn-block" id="tabLogin" onclick="switchAuthTab('login')">Entrar</button>
                <button type="button" class="btn btn-secondary btn-block" id="tabRegister" onclick="switchAuthTab('register')">Criar conta</button>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
            </form>
            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label class="form-label">Nome completo</label>
                    <input type="text" class="form-input" id="registerName" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-input" id="registerEmail" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Telefone</label>
                        <input type="tel" class="form-input" id="registerPhone" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15" required oninput="maskPhone(this)">
                </div>
                <div class="form-group">
                    <label class="form-label">CPF</label>
                        <input type="text" class="form-input" id="registerCPF" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required oninput="maskCPF(this)">
                </div>
                <div class="form-group">
                    <label class="form-label">Veículo</label>
                    <select class="form-input" id="registerVehicle">
                        <option value="moto">🏍️ Moto</option>
                        <option value="bicicleta">🚲 Bicicleta</option>
                        <option value="carro">🚗 Carro</option>
                    </select>
                </div>
                <div class="form-group">
                        <label class="form-label">Placa</label>
                        <input type="text" class="form-input" id="registerPlate" placeholder="ABC-1234" maxlength="8" oninput="maskPlate(this)">
                </div>
                <div class="form-group">
                    <label class="form-label">PIX</label>
                    <input type="text" class="form-input" id="registerPix" placeholder="Chave PIX">
                </div>
                <div class="form-group">
                    <label class="form-label">Instagram (@ opcional)</label>
                    <input type="text" class="form-input" id="registerInstagram" placeholder="@seuusuario" maxlength="31" oninput="maskInstagram(this)">
                </div>
                <div class="form-group">
                    <label class="form-label">Dias disponíveis</label>
                    <select class="form-input" id="registerDays" multiple size="5">
                        <option value="seg">Segunda</option>
                        <option value="ter">Terça</option>
                        <option value="qua">Quarta</option>
                        <option value="qui">Quinta</option>
                        <option value="sex">Sexta</option>
                        <option value="sab">Sábado</option>
                        <option value="dom">Domingo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Horários disponíveis</label>
                    <input type="text" class="form-input" id="registerHours" placeholder="Ex: 08:00-12:00, 14:00-18:00">
                </div>
                <div class="form-group">
                    <label class="form-label">Senha</label>
                    <input type="password" class="form-input" id="registerPassword" placeholder="8+ caracteres, maiúscula, minúscula e número" minlength="8" maxlength="32" required oninput="updatePasswordStrength()">
                    <div id="passwordStrength" class="auth-hint" style="text-align:left;margin-top:6px;">Força da senha: -</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmar senha</label>
                    <input type="password" class="form-input" id="registerConfirmPassword" placeholder="Repita a senha" minlength="8" maxlength="32" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Criar conta</button>
            </form>
            <p class="auth-hint" id="authHint">Credenciais fornecidas pelo administrador</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
<script src="modules/fcm.js"></script>
    <script src="modules/driver-auth.js"></script>
    <script src="modules/update-guard.js"></script>
    <script src="modules/cache.js"></script>
    <script src="modules/firebase-init.js"></script>
    <script>
        // Theme
        (function(){
            var t=localStorage.getItem('pedrad-theme')||'dark';
            document.documentElement.setAttribute('data-theme',t);
            var m=document.querySelector('meta[name="theme-color"]');
            if(m)m.setAttribute('content',t==='light'?'#f5f5f7':'#0a0a0c');
        })();

        (async () => {
            const updateOk = await AppUpdateGuard.checkAndBlockIfNeeded();
            if (!updateOk) return;

            // If already logged in, go to home
            const savedId = localStorage.getItem('pedrad_driver_id');
            if (savedId) {
                window.location.href = 'home.html';
                return;
            }
        })();

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function maskPhone(el) {
            const digits = el.value.replace(/\D/g, '').slice(0, 11);
            if (digits.length <= 10) {
                const m = digits.match(/^(\d{0,2})(\d{0,4})(\d{0,4})$/);
                el.value = !m ? digits : [m[1] && `(${m[1]})`, m[2], m[3] && `-${m[3]}`].filter(Boolean).join(' ');
                return;
            }
            const m = digits.match(/^(\d{0,2})(\d{0,5})(\d{0,4})$/);
            el.value = !m ? digits : `(${m[1]}) ${m[2]}${m[3] ? '-' + m[3] : ''}`;
        }

        function maskCPF(el) {
            const d = el.value.replace(/\D/g, '').slice(0, 11);
            let v = d;
            if (v.length > 3) v = v.replace(/^(\d{3})(\d)/, '$1.$2');
            if (v.length > 7) v = v.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
            if (v.length > 11) v = v.replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
            el.value = v;
        }

        function maskPlate(el) {
            const raw = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 7);
            el.value = raw.length > 3 ? `${raw.slice(0, 3)}-${raw.slice(3, 7)}` : raw;
        }

        function maskInstagram(el) {
            const raw = el.value.replace(/^@+/, '').replace(/[^A-Za-z0-9._]/g, '').slice(0, 30);
            el.value = raw ? '@' + raw : '';
        }

        function isStrongPassword(pw) {
            return /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(pw);
        }

        function updatePasswordStrength() {
            const pw = document.getElementById('registerPassword').value;
            const out = document.getElementById('passwordStrength');
            if (!pw) { out.textContent = 'Força da senha: -'; return; }
            out.textContent = isStrongPassword(pw) ? 'Força da senha: forte' : 'Força da senha: fraca';
        }

        function switchAuthTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
            document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
            document.getElementById('tabLogin').className = isLogin ? 'btn btn-primary btn-block' : 'btn btn-secondary btn-block';
            document.getElementById('tabRegister').className = isLogin ? 'btn btn-secondary btn-block' : 'btn btn-primary btn-block';
            document.getElementById('authHint').textContent = isLogin
                ? 'Credenciais fornecidas pelo administrador'
                : 'Seu cadastro ficará pendente até aprovação do administrador';
        }

        function getSelectedValues(selectId) {
            return Array.from(document.getElementById(selectId)?.selectedOptions || []).map(option => option.value);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Entrando...';

            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            try {
                const snapshot = await db.collection('drivers')
                    .where('email', '==', email)
                    .limit(1)
                    .get();

                if (snapshot.empty) {
                    showToast('Entregador não cadastrado');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }

                const driver = { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };

                if (driver.status === 'blocked') {
                    showToast('Sua conta está bloqueada');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }

                if (driver.password !== password) {
                    showToast('Senha incorreta');
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    return;
                }

                // Save session
                Cache.setDriverId(driver.id);
                Cache.setDriver(driver);
                Cache.setOnline(false);

                window.location.href = 'home.html';

            } catch (err) {
                console.error('Login error:', err);
                showToast('Erro ao entrar');
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const ok = await DriverAuth.register({
                    name: document.getElementById('registerName').value,
                    email: document.getElementById('registerEmail').value,
                    phone: document.getElementById('registerPhone').value.replace(/\D/g, ''),
                    cpf: document.getElementById('registerCPF').value.replace(/\D/g, ''),
                    vehicle: document.getElementById('registerVehicle').value,
                    plate: document.getElementById('registerPlate').value.toUpperCase(),
                    pix: document.getElementById('registerPix').value,
                    instagramHandle: document.getElementById('registerInstagram').value,
                    availableDays: getSelectedValues('registerDays'),
                    availableHours: document.getElementById('registerHours').value.split(',').map(s => s.trim()).filter(Boolean),
                    password: document.getElementById('registerPassword').value,
                    confirmPassword: document.getElementById('registerConfirmPassword').value
                });
                if (ok) {
                    e.target.reset();
                    switchAuthTab('login');
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Criar conta';
            }
        });
    </script>

<!-- ====== BLOCO 1: Banner de verificação de email (inserir ANTES do profile-header) ====== -->

<div id="emailBanner" class="email-banner" style="display:none;">
    <div class="email-banner-icon">📧</div>
    <div class="email-banner-content">
        <div class="email-banner-title" id="emailBannerTitle">Confirme seu e-mail</div>
        <div class="email-banner-text" id="emailBannerText">
            Verifique sua caixa de entrada para confirmar seu e-mail.
        </div>
    </div>
    <div class="email-banner-actions">
        <button class="email-banner-btn" onclick="handleResendVerification()">Reenviar</button>
        <button class="email-banner-btn secondary" onclick="handleCheckVerification()">Já confirmei</button>
    </div>
</div>

<!-- Banner de senha temporária -->
<div id="tempPasswordBanner" class="email-banner danger" style="display:none;">
    <div class="email-banner-icon">⚠️</div>
    <div class="email-banner-content">
        <div class="email-banner-title">Senha Temporária Ativa</div>
        <div class="email-banner-text">
            Sua senha foi redefinida pelo administrador. Altere para uma senha pessoal o mais rápido possível.
        </div>
    </div>
    <div class="email-banner-actions">
        <button class="email-banner-btn" onclick="scrollToSecurity()">Alterar Agora</button>
    </div>
</div>




    <div id="changePasswordSection" class="collapsible-section" style="display:none;">
        <div class="section-form">
            <div class="form-group">
                <label class="form-label-sm">Senha atual</label>
                <input type="password" class="form-input-sm" id="currentPasswordInput" placeholder="Senha atual">
            </div>
            <div class="form-group">
                <label class="form-label-sm">Nova senha</label>
                <input type="password" class="form-input-sm" id="newPasswordInput" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label class="form-label-sm">Confirmar nova senha</label>
                <input type="password" class="form-input-sm" id="confirmPasswordInput" placeholder="Repita a nova senha">
            </div>        </div>
    </div>
</div>


<!-- Email banners, collapsible sections, badges e btn-action: ver index.css -->


<!-- ====== BLOCO 4: JavaScript (adicionar ao <script> existente) ====== -->

<script>
    // ===== Call these on page load (add to DOMContentLoaded) =====
    // After checkAuth() and updateProfileUI():
    //   updateSecurityUI();
    //   checkBanners();

    function updateSecurityUI() {
        if (!driverData) return;
        
        const emailStatus = document.getElementById('emailStatusValue');
        const user = auth?.currentUser || firebase.auth().currentUser;
        const verified = driverData.emailVerified || (user && user.emailVerified);
        
        emailStatus.innerHTML = verified
            ? `<span class="email-verified-badge">✅ Verificado</span>`
            : `<span class="email-unverified-badge">❌ Não verificado</span>`;
    }

    function checkBanners() {
        if (!driverData) return;
        
        const user = auth?.currentUser || firebase.auth().currentUser;
        const verified = driverData.emailVerified || (user && user.emailVerified);
        
        // Email verification banner
        if (!verified) {
            document.getElementById('emailBanner').style.display = 'flex';
        } else {
            document.getElementById('emailBanner').style.display = 'none';
        }
        
        // Temp password banner
        if (driverData.passwordOverride) {
            document.getElementById('tempPasswordBanner').style.display = 'flex';
        }
    }

    // ===== Handlers =====
    async function handleResendVerification() {
        if (typeof DriverAuth !== 'undefined') {
            await DriverAuth.resendVerification();
        } else {
            const user = firebase.auth().currentUser;
            if (user) {
                try {
                    await user.sendEmailVerification();
                    showToast('📧 Email de verificação reenviado!');
                } catch(e) {
                    showToast('Aguarde antes de reenviar');
                }
            }
        }
    }

    async function handleCheckVerification() {
        const user = firebase.auth().currentUser;
        if (!user) { showToast('Faça login novamente'); return; }
        
        await user.reload();
        if (user.emailVerified) {
            await db.collection('drivers').doc(driverData.id).update({ emailVerified: true });
            driverData.emailVerified = true;
            document.getElementById('emailBanner').style.display = 'none';
            updateSecurityUI();
            showToast('✅ Email verificado com sucesso!');
        } else {
            showToast('Email ainda não verificado. Verifique sua caixa de entrada.');
        }
    }

    async function handleChangePassword() {
        const current = document.getElementById('currentPasswordInput').value;
        const newPass = document.getElementById('newPasswordInput').value;
        const confirm = document.getElementById('confirmPasswordInput').value;

        if (!current) { showToast('Informe a senha atual'); return; }
        if (!newPass || newPass.length < 6) { showToast('Nova senha: mínimo 6 caracteres'); return; }
        if (newPass !== confirm) { showToast('Senhas não conferem'); return; }

        let success = false;
        if (typeof DriverAuth !== 'undefined') {
            success = await DriverAuth.changePassword(current, newPass);
        } else {
            // Fallback without module
            const user = firebase.auth().currentUser;
            if (!user) { showToast('Faça login novamente'); return; }
            try {
                const credential = firebase.auth.EmailAuthProvider.credential(user.email, current);
                await user.reauthenticateWithCredential(credential);
                await user.updatePassword(newPass);
                if (driverData?.id) {
                    await db.collection('drivers').doc(driverData.id).update({
                        passwordOverride: false,
                        tempPassword: firebase.firestore.FieldValue.delete(),
                        passwordChangedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                success = true;
                showToast('✅ Senha alterada!');
            } catch(e) {
                showToast(e.code === 'auth/wrong-password' ? 'Senha atual incorreta' : 'Erro: ' + e.message);
            }
        }

        if (success) {
            document.getElementById('currentPasswordInput').value = '';
            document.getElementById('newPasswordInput').value = '';
            document.getElementById('confirmPasswordInput').value = '';
            document.getElementById('changePasswordSection').style.display = 'none';
            // Hide temp password banner
            document.getElementById('tempPasswordBanner').style.display = 'none';
            if (driverData) driverData.passwordOverride = false;
        }
    }

    async function handleChangeEmail() {
        const newEmail = document.getElementById('newEmailInput').value.trim();
        const password = document.getElementById('emailConfirmPassword').value;

        if (!newEmail || !newEmail.includes('@')) { showToast('Email inválido'); return; }
        if (!password) { showToast('Informe sua senha para confirmar'); return; }

        // Check email verification first
        const user = firebase.auth().currentUser;
        if (user && !user.emailVerified) {
            showToast('Confirme seu email atual antes de alterar');
            return;
        }

        let success = false;
        if (typeof DriverAuth !== 'undefined') {
            success = await DriverAuth.changeEmail(newEmail, password);
        } else {
            try {
                const credential = firebase.auth.EmailAuthProvider.credential(user.email, password);
                await user.reauthenticateWithCredential(credential);
                await user.verifyBeforeUpdateEmail(newEmail);
                if (driverData?.id) {
                    await db.collection('drivers').doc(driverData.id).update({
                        email: newEmail.toLowerCase(),
                        emailVerified: false
                    });
                }
                success = true;
                showToast('📧 Verificação enviada para ' + newEmail);
            } catch(e) {
                showToast(e.code === 'auth/wrong-password' ? 'Senha incorreta' : 'Erro: ' + e.message);
            }
        }

        if (success) {
            document.getElementById('newEmailInput').value = '';
            document.getElementById('emailConfirmPassword').value = '';
            document.getElementById('changeEmailSection').style.display = 'none';
            checkBanners();
            updateSecurityUI();
        }
    }

    function toggleSection(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function scrollToSecurity() {
        document.getElementById('securitySection').scrollIntoView({ behavior: 'smooth' });
        // Auto-open password change
        document.getElementById('changePasswordSection').style.display = 'block';
    }
</script>
</body>
